# Decoder-only Transformer (RoPE + KV cache) over REMI tokens. Recommended default.
name: transformer
data:
  midi_dir: data/midi
  representation: tokens
  melody_only: true
  seq_len: 512
  stride: 256
  transpose_range: 5
model:
  arch: transformer
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.1
  max_len: 1024
train:
  output_dir: runs/transformer
  epochs: 40
  batch_size: 32
  lr: 3.0e-4
  warmup_steps: 300
  patience: 6
generation:
  bars: 16
  temperature: 0.95
  top_p: 0.95
