[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musegen"
version = "1.0.0"
description = "Symbolic music generation with LSTMs and Transformers: MIDI processing, REMI tokenization, grammar- and key-constrained sampling, and musical evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Edwin Cortazo" }]
keywords = ["music generation", "midi", "lstm", "transformer", "deep learning", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "pretty_midi>=0.2.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
audio = ["pyfluidsynth>=1.3"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
musegen = "musegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musegen = ["configs/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
