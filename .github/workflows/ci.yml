name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Unit and pipeline tests
        run: pytest -v
      - name: CLI smoke run (synthetic data -> train -> generate -> evaluate)
        run: |
          musegen synth-data --dest data/synthetic --n 32
          musegen train -c smoke
          musegen generate -m runs/smoke/best.pt -o output/smoke.mid --num 2 --key "A minor" --plot --wav
          musegen evaluate -m runs/smoke/best.pt --num-samples 4 --bars 8
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: smoke-outputs
          path: |
            output/
            runs/smoke/eval/
